name: emville_pms
description: "A new Flutter project."
publish_to: "none"

version: 1.2.0+2026111501

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Core app/runtime deps ---
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  go_router: ^18.1.3

  # --- Supabase SDKs (aligned to your upgrade output) ---
  supabase_flutter: ^2.10.3
  supabase: ^2.10.0
  functions_client: ^2.5.0
  gotrue: ^2.16.0
  realtime_client: ^2.6.0
  storage_client: ^2.4.1   # keep as-is (no resolvable bump shown)

  # --- Firebase / notifications (leave as working) ---
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  onesignal_flutter: ^5.2.4

  # --- Utilities / platform ---
  flutter_dotenv: any
  file_picker: ^13.3.2
  intl: ^0.20.2
  path: any
  image_picker: ^1.2.0
  open_filex: any
  http: any
  image: any           # still resolvable to 4.3.x on your toolchain; we won't force 4.5.x
  flutter_web_auth_2: ^5.1.0
  cupertino_icons: any
  crypto: ^3.0.6
  device_calendar_plus: ^0.12.0
  shared_preferences: ^2.5.3
  uuid: any
  pdf: any
  printing: any
  path_provider: ^2.1.5
  share_plus: any
  excel: any
  url_launcher: ^6.3.2   # bump from 6.3.2 → 6.3.24 (resolvable)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  fonts:
    - family: EmvilleSerif
      fonts:
        - asset: assets/fonts/Gelasio.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic

  assets:
    - assets/brand/
    - assets/images/property/
    - env/dev.env
    - assets/icons/app_icon.png
    - assets/images/app_icon.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Italic.ttf
    # - .env   # (left commented on purpose)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true